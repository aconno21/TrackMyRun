<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#070a13" />
  <!-- Circular glowing track -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255, 255, 255, 0.03)" stroke-width="24" fill="none" />
  <!-- Glowing neon logo mark -->
  <g filter="url(#glow)">
    <!-- Runner path silhouette -->
    <path d="M140 360 C 180 240, 240 180, 370 150" stroke="url(#glowGrad)" stroke-width="28" stroke-linecap="round" fill="none" />
    <path d="M160 380 C 220 300, 300 240, 350 240" stroke="#10b981" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="370" cy="150" r="16" fill="#f8fafc" />
  </g>
</svg>
